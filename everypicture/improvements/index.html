<!DOCTYPE html>
<html lang="en">
<head>
    <title>Every Picture</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>

</head>
<body>

    <header>
        <h1>friends take over the bay</h1>
    </header>

    <div class="strip">
        <div class="track">

            <figure class="photo">
                <img src="images/backseat.png" alt="backseat" data-zoom="images/backseat2.png">
                <figcaption>in the backseat</figcaption>
            </figure>

            <figure class="photo">
                <img src="images/driving.png" alt="sf" data-zoom="images/driving2.png">
                <figcaption>somewhere in the city</figcaption>
            </figure>

            <figure class="photo">
                <img src="images/friends.png" alt="mount tam" data-zoom="images/friends2.png">
                <figcaption>above the clouds</figcaption>
            </figure>

            <figure class="photo">
                <img src="images/goldengate.png" alt="golden gate bridge" data-zoom="images/goldengateii.png">
                <figcaption>golden gate bridge</figcaption>
            </figure>

            <figure class="photo">
                <img src="images/goldengate2.png" alt="i love the bay area" data-zoom="images/goldengate22.png">
                <figcaption>i love the bay area</figcaption>
            </figure>

            <!-- duplicates for seamless loop -->

            <figure class="photo">
                <img src="images/backseat.png" alt="backseat" data-zoom="images/backseat2.png">
                <figcaption>in the backseat</figcaption>
            </figure>

            <figure class="photo">
                <img src="images/driving.png" alt="sf" data-zoom="images/driving2.png">
                <figcaption>somewhere in the city</figcaption>
            </figure>

            <figure class="photo">
                <img src="images/friends.png" alt="mount tam" data-zoom="images/friends2.png">
                <figcaption>above the clouds</figcaption>
            </figure>

            <figure class="photo">
                <img src="images/goldengate.png" alt="golden gate bridge" data-zoom="images/goldengate2.png">
                <figcaption>golden gate bridge</figcaption>
            </figure>

            <figure class="photo">
                <img src="images/goldengate2.png" alt="i love the bay area" data-zoom="images/goldengateii.png">
                <figcaption>i love the bay area</figcaption>
            </figure>

        </div>
    </div>

    <!-- Lightbox -->
    <div id="overlay">
        <img id="overlayImg" src="#" alt="#">
    </div>

</body>
</html>
