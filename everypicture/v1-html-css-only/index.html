<!DOCTYPE html>
<html lang="en">
<head>
    <title>Every Picture</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1>friends take over the bay</h1>
    </header>

    <div class="strip">
        <div class="track">

            <figure class="photo">
                <img src="images/backseat.png" alt="Friends in the backseat" width="300" height="225">
                <figcaption>ogs</figcaption>
            </figure>

            <figure class="photo">
                <img src="images/driving.png" alt="Driving through SF" width="300" height="225">
                <figcaption>somewhere in the city</figcaption>
            </figure>

            <figure class="photo">
                <img src="images/friends.png" alt="Friends on the mountain" width="300" height="225">
                <figcaption>above the clouds</figcaption>
            </figure>

            <figure class="photo">
                <img src="images/goldengate.png" alt="Golden Gate Bridge tower" width="300" height="225">
                <figcaption>golden gate</figcaption>
            </figure>

            <figure class="photo">
                <img src="images/goldengate2.png" alt="Golden Gate from the beach" width="300" height="225">
                <figcaption>free</figcaption>
            </figure>

            <!-- duplicates for seamless loop -->

            <figure class="photo">
                <img src="images/backseat.png" alt="Friends in the backseat" width="300" height="225">

            <figure class="photo">

            </figure>

            <figure class="photo">
                <img src="images/goldengate.png" alt="Golden Gate Bridge tower" width="300" height="225">

            </figure>

            <figure class="photo">
                <img src="images/goldengate2.png" alt="Golden Gate from the beach" width="300" height="225">
                <figcaption>free</figcaption>
            </figure>

        </div>
    </div>

</body>
</html>
